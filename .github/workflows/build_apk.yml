name: Build IRIS Android APK (Cloud Builder)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or Unpack Flutter Project Root
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p extracted
          for z in ./*.zip; do
            echo "Unpacking $z..."
            unzip -q -o "$z" -d extracted
          done

          MAIN_PUBSPEC=""
          if [ -f "pubspec.yaml" ] && grep -q "^name: iris" pubspec.yaml; then
            MAIN_PUBSPEC="pubspec.yaml"
          else
            MAIN_PUBSPEC=$(grep -rl "^name: iris" --include="pubspec.yaml" extracted . 2>/dev/null | grep -v "/.git/" | head -n 1 || true)
          fi
          if [ -z "$MAIN_PUBSPEC" ]; then
            MAIN_PUBSPEC=$(find extracted . -maxdepth 4 -name "pubspec.yaml" -not -path "./.git/*" -not -path "*/packages/*" 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$MAIN_PUBSPEC" ]; then
            echo "::error::Could not find the IRIS Flutter pubspec.yaml. Add the project ZIP to the repository root."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$MAIN_PUBSPEC")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Located Flutter project at: $PROJECT_DIR"
          sed -i "s/sdk: \^3\.11\.0/sdk: '>=3.5.0 <4.0.0'/g" "$PROJECT_DIR/pubspec.yaml" || true

          # Recover the absent local Material 3 Expressive package using its
          # published version only when the project declares that local path.
          if grep -q "path: packages/material_3_expressive" "$PROJECT_DIR/pubspec.yaml" && [ ! -f "$PROJECT_DIR/packages/material_3_expressive/pubspec.yaml" ]; then
            python3 - "$PROJECT_DIR/pubspec.yaml" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace("path: packages/material_3_expressive", "version: ^1.1.3")
          p.write_text(s)
          PY
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Apply Dart and API compatibility fixes
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          # Enable the Dart language features already used by this source tree.
          p = root / 'pubspec.yaml'
          s = p.read_text()
          s = re.sub(r"sdk:\s*['\"]?[^'\"\\n]+['\"]?", "sdk: '>=3.8.0 <4.0.0'", s, count=1)
          p.write_text(s)
          # Dart versions in the cloud image reject duplicate named-parameter identifiers.
          for p in (root / 'lib').rglob('*.dart'):
              s = p.read_text()
              s = s.replace('(_, _) =>', '(_, __) =>')
              s = s.replace('(context, _, _) {', '(context, animation, secondaryAnimation) {')
              s = s.replace('(context, _, _) =>', '(context, animation, secondaryAnimation) =>')
              p.write_text(s)
          # DeadlineData is rendered as a completed/pending item by the schedule screen.
          p = root / 'lib/services/helpdesk_schedule_data_service.dart'
          s = p.read_text()
          needle = 'class DeadlineData {\n  final String title;'
          if needle in s and 'class DeadlineData {\n  bool get isDone' not in s:
              s = s.replace(needle, 'class DeadlineData {\n  bool get isDone => SemesterMilestoneEvaluator.isCompleted(date, explicitStatus: status);\n  final String title;', 1)
          p.write_text(s)
          # Adapt the typed library schedule payload to the existing view model.
          p = root / 'lib/screens/tools/library_schedule_screen.dart'
          s = p.read_text().replace('_libraryData = payload.librarySchedule;', "_libraryData = payload.librarySchedule == null ? <String, dynamic>{} : <String, dynamic>{'open': payload.librarySchedule!.open, 'break': payload.librarySchedule!.breakTime, 'close': payload.librarySchedule!.close};")
          p.write_text(s)
          # RoomData was renamed to Room; preserve the fields expected by the campus UI.
          p = root / 'lib/screens/tools/uni_info_screen.dart'
          s = p.read_text()
          if "import '../../core/models.dart';" not in s:
              s = s.replace("import '../../core/animations.dart';", "import '../../core/animations.dart';\\nimport '../../core/models.dart';")
          if 'typedef RoomData = Room;' not in s:
              s = s.replace("import 'resource_hero_card.dart';", "import 'resource_hero_card.dart';\n\ntypedef RoomData = Room;\nextension RoomDataCompatibility on Room {\n  String? get attendantName => RoomPersistenceService.parseRoomCode(id).attendant;\n  String? get attendantContact => RoomPersistenceService.parseRoomCode(id).mobile;\n  String get floor => RoomPersistenceService.parseRoomCode(id).floor;\n}")
          p.write_text(s)
          # Fix current Flutter and package API mismatches.
          p = root / 'lib/widgets/effects/glass_container_transform.dart'
          s = p.read_text().replace('center: Offset(clampedX, clampedY),', 'center: Offset(clampedX.toDouble(), clampedY.toDouble()),')
          p.write_text(s)
          p = root / 'lib/core/animations.dart'
          s = p.read_text().replace('duration: transitionDuration ?? const Duration(milliseconds: 420),', 'transitionDuration: transitionDuration ?? const Duration(milliseconds: 420),')
          p.write_text(s)
          p = root / 'lib/widgets/cards/class_card.dart'
          s = p.read_text()
          if 'IrisThemeStyle get currentStyle' not in s:
              s = s.replace('class _ClassCardState extends State<ClassCard> {', 'class _ClassCardState extends State<ClassCard> {\\n  IrisThemeStyle get currentStyle => IrisThemeSignals.themeStyle.value;')
          p.write_text(s)
          p = root / 'lib/widgets/controls/iris_expressive_controls.dart'
          s = p.read_text().replace('segments: segments,', 'segments: segments.map((label) => lgw.GlassSegment(label: label, value: label)).toList(),')
          p.write_text(s)
          for name in ['lib/screens/dashboard_screen.dart', 'lib/screens/faculty/faculty_schedule_view.dart']:
              p = root / name
              s = p.read_text().replace('const SliverToBoxAdapter(', 'SliverToBoxAdapter(')
              p.write_text(s)
          PY

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/IRIS-LiquidGlass-Perfected-Release.apk"

      - name: Upload APK Artifact (Downloadable in Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-LiquidGlass-Perfected-APK
          path: IRIS-LiquidGlass-Perfected-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases (Direct 1-Tap Phone Download)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3-perfected-${{ github.run_number }}
          name: "IRIS Perfected Liquid Glass & 7-Theme Build (#${{ github.run_number }})"
          body: |
            ### Direct Android APK Download (No Computer Required)
            Tap **IRIS-LiquidGlass-Perfected-Release.apk** under Assets below to download and install directly on your Android phone.
          files: IRIS-LiquidGlass-Perfected-Release.apk
