name: Build IRIS Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Locate and extract Flutter project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          # Prefer a project already checked into the repository.
          PROJECT_DIR=""
          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          else
            # The project is normally uploaded as a ZIP. Extract archives into
            # a dedicated directory so we don't overwrite the workflow files.
            mkdir -p extracted
            shopt -s nullglob
            found_archive=false

            for archive in ./*.zip; do
              found_archive=true
              echo "Extracting $archive"
              unzip -o "$archive" -d extracted
            done

            for archive in ./iris_chunk_*.b64; do
              found_archive=true
              echo "Decoding $archive"
              tmp="$(mktemp)"
              tr -d '\n\r ' < "$archive" | base64 -d > "$tmp"
              if tar -tf "$tmp" >/dev/null 2>&1; then
                tar -xf "$tmp" -C extracted
              else
                echo "::error::Decoded archive $archive is not a valid tar archive."
                exit 1
              fi
              rm -f "$tmp"
            done

            # Pick the Flutter application (pubspec plus lib/main.dart), not a
            # nested package's pubspec.yaml.
            while IFS= read -r candidate; do
              dir="$(dirname "$candidate")"
              if [ -f "$dir/lib/main.dart" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done < <(find extracted -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | sort)

            # Also support a ZIP whose contents are at the repository root.
            if [ -z "$PROJECT_DIR" ] && [ -f "lib/main.dart" ]; then
              PROJECT_DIR="."
            fi

            if [ -z "$PROJECT_DIR" ]; then
              echo "::error::No Flutter app found. Expected pubspec.yaml and lib/main.dart in the repo or uploaded ZIP."
              echo "Repository files:"
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
          fi

          echo "Flutter project located at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Repair missing Material 3 Expressive local package
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -qE '^  material_3_expressive:[[:space:]]*$' pubspec.yaml; then
            echo "No path-based material_3_expressive dependency declared; nothing to repair."
            exit 0
          fi

          PACKAGE_DIR="packages/material_3_expressive"
          if [ -f "$PACKAGE_DIR/pubspec.yaml" ]; then
            echo "Material 3 Expressive package already exists."
            exit 0
          fi

          echo "::warning::Local package is missing. Restoring it from the maintained IRIS source repository."
          tmp="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/malikaurangzaibahmed-lab/iris-enhanced.git "$tmp/iris-source"
          git -C "$tmp/iris-source" sparse-checkout set packages/material_3_expressive
          if [ ! -f "$tmp/iris-source/packages/material_3_expressive/pubspec.yaml" ]; then
            echo "::error::Could not retrieve packages/material_3_expressive from iris-enhanced."
            exit 1
          fi
          mkdir -p "$PACKAGE_DIR"
          cp -a "$tmp/iris-source/packages/material_3_expressive/." "$PACKAGE_DIR/"
          rm -rf "$tmp"
          test -f "$PACKAGE_DIR/pubspec.yaml"
          echo "Restored $PACKAGE_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Dart versions
        run: flutter --version

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze and build release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter build apk --release --no-tree-shake-icons
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/IRIS-LiquidGlass-Release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-LiquidGlass-APK
          path: IRIS-LiquidGlass-Release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iris-apk-build-${{ github.run_number }}
          name: IRIS Android APK Build #${{ github.run_number }}
          body: |
            Release APK built by GitHub Actions from the uploaded IRIS Flutter project.
          files: IRIS-LiquidGlass-Release.apk
