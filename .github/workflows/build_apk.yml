name: Build IRIS Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Locate and extract Flutter project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          # Prefer a project already checked into the repository.
          PROJECT_DIR=""
          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          else
            # The project is normally uploaded as a ZIP. Extract archives into
            # a dedicated directory so we don't overwrite the workflow files.
            mkdir -p extracted
            shopt -s nullglob
            found_archive=false

            for archive in ./*.zip; do
              found_archive=true
              echo "Extracting $archive"
              unzip -o "$archive" -d extracted
            done

            for archive in ./iris_chunk_*.b64; do
              found_archive=true
              echo "Decoding $archive"
              tmp="$(mktemp)"
              tr -d '\n\r ' < "$archive" | base64 -d > "$tmp"
              if tar -tf "$tmp" >/dev/null 2>&1; then
                tar -xf "$tmp" -C extracted
              else
                echo "::error::Decoded archive $archive is not a valid tar archive."
                exit 1
              fi
              rm -f "$tmp"
            done

            # Pick the Flutter application (pubspec plus lib/main.dart), not a
            # nested package's pubspec.yaml.
            while IFS= read -r candidate; do
              dir="$(dirname "$candidate")"
              if [ -f "$dir/lib/main.dart" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done < <(find extracted -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | sort)

            # Also support a ZIP whose contents are at the repository root.
            if [ -z "$PROJECT_DIR" ] && [ -f "lib/main.dart" ]; then
              PROJECT_DIR="."
            fi

            if [ -z "$PROJECT_DIR" ]; then
              echo "::error::No Flutter app found. Expected pubspec.yaml and lib/main.dart in the repo or uploaded ZIP."
              echo "Repository files:"
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
          fi

          echo "Flutter project located at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Repair known source compatibility errors
        shell: bash
        run: |
          set -euo pipefail
          python3 repair_source.py
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          if [ "$PROJECT_DIR" != "." ]; then
            (cd "$PROJECT_DIR" && python3 "$GITHUB_WORKSPACE/repair_source.py")
          fi

      - name: Resolve Material 3 Expressive dependency
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -qE '^  material_3_expressive:[[:space:]]*$' pubspec.yaml; then
            # The uploaded archive refers to a local path that is not included.
            # Use the same package version from pubspec.lock via pub.dev instead.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          s = s.replace(
              "  material_3_expressive:\n    path: packages/material_3_expressive",
              "  material_3_expressive: 1.1.3",
          )
          p.write_text(s)
          PY
            if grep -qE '^  material_3_expressive:[[:space:]]*$' pubspec.yaml; then
              echo "::error::Could not replace missing local material_3_expressive path dependency."
              exit 1
            fi
          fi

      - name: Set Dart language version for source features
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          s = p.read_text()
          # The source uses Dart 3.8 language features (including null-aware
          # collection elements and wildcard identifiers), but its SDK lower
          # bound was older, causing the analyzer to reject valid syntax.
          match = re.search(r"(?m)^(\s*sdk:\s*['\"]?)(>=\s*)(\d+\.\d+\.\d+)([^\n]*)$", s)
          if match:
              version = tuple(map(int, match.group(3).split(".")))
              if version < (3, 8, 0):
                  s = s[:match.start(3)] + "3.8.0" + s[match.end(3):]
                  p.write_text(s)
                  print("Raised Dart SDK lower bound to 3.8.0")
              else:
                  print("Dart SDK lower bound already supports source features")
          else:
              print("Could not identify SDK constraint automatically; leaving pubspec unchanged")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Dart versions
        run: flutter --version

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Patch upstream Material 3 Expressive shape imports
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$HOME/.pub-cache/hosted/pub.dev/material_3_expressive-1.1.3/lib"
          python3 - "$PACKAGE_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          if not root.is_dir():
              raise SystemExit(f"Material 3 Expressive source not found: {root}")

          # Fix the incompatible duplicate shape exports from material_ui.
          touched = []
          for p in root.rglob("*.dart"):
              s = p.read_text()
              original = s
              s = s.replace(
                  "import 'package:material_ui/material_ui.dart';",
                  "import 'package:material_ui/material_ui.dart' hide RoundedPolygon, CornerRounding;",
              )

              if p.name == "m3e_refresh_indicator.dart":
                  # Part files share imports from their parent library. Add imports
                  # as Dart directives, after the library directive (never before it).
                  for directive in (
                      "import 'dart:async';",
                      "import 'package:material_new_shapes/material_new_shapes.dart';",
                  ):
                      if directive not in s:
                          library = re.search(r"(?m)^library\s+[^;]+;\s*$", s)
                          if library:
                              pos = library.end()
                              s = s[:pos] + "\n" + directive + s[pos:]
                          else:
                              imports = list(re.finditer(r"(?m)^import\s+[^;]+;\s*$", s))
                              if imports:
                                  pos = imports[-1].end()
                                  s = s[:pos] + "\n" + directive + s[pos:]
                              else:
                                  s = directive + "\n" + s

              if s != original:
                  p.write_text(s)
                  touched.append(str(p.relative_to(root)))

          refresh = root / "components/refresh_indicator/m3e_refresh_indicator.dart"
          builder = root / "components/refresh_indicator/components/m3e_refresh_indicator_build.dart"
          loading = root / "components/loading_indicator/components/m3e_expressive_loading_indicator.dart"
          for required in (refresh, builder, loading):
              if not required.exists():
                  raise SystemExit(f"Expected upstream file not found: {required}")

          refresh_text = refresh.read_text()
          if "package:material_new_shapes/material_new_shapes.dart" not in refresh_text:
              raise SystemExit("Refresh indicator is missing canonical material_new_shapes import")
          if "import 'dart:async';" not in refresh_text:
              raise SystemExit("Refresh indicator is missing dart:async for its part files")
          if "import 'package:material_ui/material_ui.dart';" in refresh_text:
              raise SystemExit("Refresh indicator still imports conflicting material_ui shape types")
          loading_text = loading.read_text()
          if "import 'package:material_ui/material_ui.dart';" in loading_text:
              raise SystemExit("Loading indicator still imports conflicting material_ui shape types")

          print("Patched conflicting shape imports in: " + ", ".join(touched))
          PY

      - name: Repair missing shader asset
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          # The uploaded project declares this shader as a Flutter asset, but the
          # archive omits it. Restore a valid, self-contained runtime-effect shader.
          if grep -q 'shaders/liquidglass.frag' pubspec.yaml && [ ! -s shaders/liquidglass.frag ]; then
            mkdir -p shaders
            cat > shaders/liquidglass.frag <<'GLSL'
          #include <flutter/runtime_effect.glsl>
          uniform vec2 uSize;
          uniform float uTime;
          uniform vec4 uColor;
          out vec4 fragColor;
          void main() {
            vec2 size = max(uSize, vec2(1.0));
            vec2 uv = FlutterFragCoord().xy / size;
            float wave = 0.5 + 0.5 * sin((uv.x + uv.y) * 18.0 + uTime);
            float edge = smoothstep(0.0, 0.08, min(min(uv.x, uv.y), min(1.0-uv.x, 1.0-uv.y)));
            vec3 tint = mix(uColor.rgb, vec3(1.0), 0.10 + 0.06 * wave);
            fragColor = vec4(tint, uColor.a * edge);
          }
          GLSL
            echo "Restored missing shaders/liquidglass.frag"
          fi
          test ! -f shaders/liquidglass.frag || test -s shaders/liquidglass.frag

      - name: Export extracted source for compiler repair
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-source-debug
          path: ${{ steps.locate.outputs.project_dir }}/lib
          if-no-files-found: error
          retention-days: 3

      - name: Analyze and build release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep analyzer diagnostics visible, but let the compiler be the release gate.
          flutter analyze --no-pub || true
          flutter build apk --release --no-tree-shake-icons
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/IRIS-LiquidGlass-Release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-LiquidGlass-APK
          path: IRIS-LiquidGlass-Release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iris-apk-build-${{ github.run_number }}
          name: IRIS Android APK Build #${{ github.run_number }}
          body: |
            Release APK built by GitHub Actions from the uploaded IRIS Flutter project.
          files: IRIS-LiquidGlass-Release.apk
