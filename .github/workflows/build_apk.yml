      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Universal & Split-ABI Release APKs
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/IRIS-v1.0.5-universal-release.apk
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-v1.0.5-Perfected-Release-APKs
          path: |
            build/app/outputs/flutter-apk/IRIS-v1.0.5-universal-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Downloadable APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5-build.${{ github.run_number }}
          name: "IRIS v1.0.5 — Liquid Glass & ColorOS 17 Perfected (Build #${{ github.run_number }})"
          body: |
            ### IRIS v1.0.5 — Perfected Release Build
            - **Download for modern Android phones**: `app-arm64-v8a-release.apk` or `IRIS-v1.0.5-universal-release.apk`
            - **Highlights**:
              - ColorOS 17 Refractive Liquid Glass Navbar (`GlassButton.custom` + `GlassQuality.premium` + smooth tap slide & continuous hover/glide-to-select)
              - 100% `GlassQuality.premium` across all Liquid Glass cards, sticky headers, and hero banners (zero standard saver shader)
              - Instant zero-restart Role (`Student` ⇄ `Faculty`), Batch, Teacher, Theme, and Academic Mode switching
              - Laminar $C^1$ spring handoff and 120 FPS spatial depth transitions
          files: |
            build/app/outputs/flutter-apk/IRIS-v1.0.5-universal-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
