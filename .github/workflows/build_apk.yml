name: Build IRIS Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or unpack Flutter project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "pubspec.yaml" ]; then
            echo "No Flutter project at repo root; checking for bundled archives..."
            shopt -s nullglob

            for archive in iris_chunk_*.b64 *.zip; do
              [ -e "$archive" ] || continue
              echo "Found archive: $archive"

              if [[ "$archive" == *.b64 ]]; then
                mkdir -p extracted
                echo "Decoding base64 bundle into extracted/"
                (cat "$archive" | tr -d '\n\r ' | base64 -d | tar -xJf - -C extracted) || \
                (cat "$archive" | tr -d '\n\r ' | base64 -d | tar -xzf - -C extracted)
              else
                echo "Unzipping archive into extracted/"
                unzip -q -o "$archive" -d extracted
              fi
            done
          fi

          PROJECT_DIR="$(find . -type f -name pubspec.yaml -not -path '*/.git/*' | head -n 1 | xargs -r dirname)"
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Flutter project was found in the repo or extracted archive."
            exit 0
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Flutter project located at: $PROJECT_DIR"

      - name: Set up JDK 17
        if: steps.locate.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.locate.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.locate.outputs.ready == 'true'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Build release APK
        if: steps.locate.outputs.ready == 'true'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/IRIS-LiquidGlass-Perfected-Release.apk"

      - name: Upload APK artifact
        if: steps.locate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-LiquidGlass-Perfected-APK
          path: IRIS-LiquidGlass-Perfected-Release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: steps.locate.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3-perfected-${{ github.run_number }}
          name: IRIS Perfected Liquid Glass Build (#${{ github.run_number }})
          body: |
            Download the APK asset below and install it directly on your Android device.
          files: IRIS-LiquidGlass-Perfected-Release.apk
